name: build-debug-image
on:
  push:
    paths:
    - '.github/workflows/publish-php-debug-images.yml'
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  push_to_registry:
    if: github.repository_owner == 'open-telemetry' #do not run in forks
    name: Build image
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5', '8.6']
        os: ['debian', 'alpine']
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:

      - name: check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # php.net only lists a branch once it has a final release, so a branch
      # still in alpha, beta or RC falls back to its newest php-src tag.
      - name: Fetch latest PHP version
        env:
          PHP_MINOR: ${{ matrix.php-version }}
        run: |
          PHP_VERSION=$(curl -fsS "https://www.php.net/releases/index.php?json&version=${PHP_MINOR}&max=1" | jq -r 'if .error then empty else keys[0] end')
          if [ -z "${PHP_VERSION}" ]; then
            PHP_VERSION=$(git ls-remote --tags --refs https://github.com/php/php-src "php-${PHP_MINOR}.*" \
              | sed -E 's|.*refs/tags/php-||; s/alpha/~1alpha/; s/beta/~2beta/; s/RC/~3RC/' \
              | sort -V | tail -n1 \
              | sed -E 's/~[123]//')
          fi
          if [ -z "${PHP_VERSION}" ]; then
            echo "No release or tag found for ${PHP_MINOR}"
            exit 1
          fi
          echo "PHP_VERSION=${PHP_VERSION}" >> "$GITHUB_ENV"
          echo "Latest version in ${PHP_MINOR} is ${PHP_VERSION}"

      - name: Build and push ${{ env.PHP_VERSION }} as ${{ matrix.php-version }}-${{ matrix.os }} to ghcr.io
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          file: docker/Dockerfile.${{ matrix.os }}
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}
          tags: ghcr.io/open-telemetry/opentelemetry-php-instrumentation/php:${{ matrix.php-version }}-${{ matrix.os }}-debug
